<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar filme</title>
</head>
<body>
    <style>
        body{
            background-color: black;
        }
        .formula_filme{
            background-color: rgb(244, 238, 125);
            margin: auto;   
            padding: 50px;
            width: 60%;
            border-radius: 10px;
            text-align: center;
        }
        .formula_filme input{
            margin: 10px;
            padding: 10px;
            width: 80%;
            border-radius: 5px;
            
        }
        h1{
            padding: 8px;
            border-radius: 20px;
            background-color: rgb(143, 5, 5);
        }
    </style>

    <form class="formula_filme">
        <h1>Formulário de Recomendações de Filmes</h1>

        
        <input id="nome" placeholder="NOME COMPLETO">
        <br>
         
        <input id="dados"  placeholder="CPF">
        <br>

        <input id="filme" placeholder="NOME DO FILME">
        <br>

        <input id="tempo" placeholder="TEMPO DE DURAÇÃO">
        <div> 
            <button id="Botão"> Enviar Sugestão</button>
        </div>
        
    </form>
     
    
    
</body>
</html>
